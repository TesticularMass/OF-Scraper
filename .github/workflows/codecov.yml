name: codecov
permissions: read-all
on:
  push:
    branches: main
    # Publish semver tags as releases.
    tags: [v*.*.*]
  pull_request:
    branches: main

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.11.5
        uses: actions/setup-python@v7
        with:
          python-version: 3.11.5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1
      - name: Install dependencies
        run: uv sync --locked --extra test --python 3.11.5
      - name: create required folder
        run: mkdir -p /home/runner/.config/ofscraper/main_profile
      - name: Run tests and collect coverage
        run: uv run --locked --extra test pytest --cov-report term --cov-report xml:coverage.xml --cov=ofscraper
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
