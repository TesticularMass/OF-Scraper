# .github/workflows/publish-release-binaries.yml
name: Build Binaries and Publish Release

on:
  workflow_call:
    inputs:
      input_version:
        description: 'The exact git tag to build (e.g., v8.4.1 or v8.4.1-alpha.1). Used for checkout ref.'
        required: true
        type: string
      package_version:
        description: 'The derived package version (e.g., 8.4.1).'
        required: true
        type: string
      long_hash:
        description: 'The full commit hash of the version.'
        required: true
        type: string
      publish:
        description: 'Publish the binaries as a GitHub Release.'
        required: false
        type: boolean
        default: true
  # Build the binaries on their own; unless published they stay on the run as artifacts.
  workflow_dispatch:
    inputs:
      package_version:
        description: 'The version used in the binary names (e.g., 8.4.1).'
        required: true
        type: string
      input_version:
        description: 'The git ref to build. Leave empty to build the branch the run starts on.'
        required: false
        type: string
      publish:
        description: 'Publish the binaries as a GitHub Release for input_version.'
        required: false
        type: boolean
        default: false
permissions:
  contents: read # Default: all jobs can read contents (e.g., for checkout)
  actions: read # Default: can read workflow run status/artifacts (e.g., for artifact download)

jobs:
  build_binaries:
    name: Build ${{ matrix.artifact_suffix }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux uses uv's portable Python and glibc 2.17 wheels to reduce the
          # minimum OS version. ARM's bundled libgcc_s can raise it. frozenlist's
          # and protobuf's compiled modules need libstdc++, which PyInstaller
          # would copy from the runner (glibc 2.38); both fall back to Python.
          # Python 3.13's iOS-only _ios_support makes PyInstaller copy libobjc.
          - artifact_suffix: linux
            os: ubuntu-24.04
            uv_python: cpython-3.13-linux-x86_64-gnu
            wheel_platform: x86_64-manylinux_2_17
            pyinstaller_opts: --exclude-module frozenlist._frozenlist --exclude-module google._upb._message --exclude-module _ios_support
          - artifact_suffix: linux_aarch64
            os: ubuntu-24.04-arm
            uv_python: cpython-3.13-linux-aarch64-gnu
            wheel_platform: aarch64-manylinux_2_17
            pyinstaller_opts: --exclude-module frozenlist._frozenlist --exclude-module google._upb._message --exclude-module _ios_support
          # 32-bit ARM runs natively on the ARM64 runner. Packages without
          # armv7 wheels are compiled with Ubuntu 22.04's cross compiler.
          - artifact_suffix: linux_armv7
            os: ubuntu-22.04-arm
            uv_python: cpython-3.13-linux-armv7-gnueabihf
            cross: arm-linux-gnueabihf
            pyinstaller_opts: --exclude-module frozenlist._frozenlist --exclude-module google._upb._message --exclude-module _ios_support
          - artifact_suffix: windows
            os: windows-latest
            python_arch: x64
          # 32-bit Python runs natively on the x64 runner
          - artifact_suffix: windows_x86
            os: windows-latest
            python_arch: x86
          - artifact_suffix: windows_arm64
            os: windows-11-arm
            python_arch: arm64
          - artifact_suffix: macos
            os: macos-latest
            python_arch: arm64
            wheel_platform: aarch64-apple-darwin
            macos_target: "11.0"
          - artifact_suffix: macos_x86_64
            os: macos-15-intel
            python_arch: x64
            wheel_platform: x86_64-apple-darwin
            macos_target: "10.13"
            # The compiled protobuf wheel requires macOS 11; use its Python fallback.
            pyinstaller_opts: --exclude-module google._upb._message

    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.input_version || github.ref }} # Use the input_version or default branch
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        id: setup_python
        if: matrix.python_arch
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
          # the runners cache older patch releases
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1

      - name: Prepare Version for Build Tools
        id: prep_build_version
        run: |
          PACKAGE_VERSION="${{ inputs.package_version }}" # Use the input package version
          SANITIZED_TAG="${PACKAGE_VERSION//./_}"
          echo "s=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "sanitized_tag=$SANITIZED_TAG" >> "$GITHUB_OUTPUT"

      - name: Install the 32-bit ARM Runtime and Cross Compiler
        if: matrix.cross
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update -q
          sudo apt-get install -y -q libc6:armhf libgcc-s1:armhf zlib1g-dev:armhf \
            gcc-${{ matrix.cross }} g++-${{ matrix.cross }} binutils-${{ matrix.cross }}

      - name: Install venv and dependencies
        run: |
          if [ -n "${{ matrix.uv_python }}" ]; then
            uv venv --managed-python --python "${{ matrix.uv_python }}" .venv
          else
            uv venv --python "${{ steps.setup_python.outputs.python-path }}" .venv
          fi
          if [ "${{ runner.os }}" == "Windows" ]; then
            . .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -c "import platform, sys; print(sys.version, platform.machine())"

          PLATFORM_ARGS=()
          if [ -n "${{ matrix.wheel_platform }}" ]; then
            PLATFORM_ARGS=(--python-platform "${{ matrix.wheel_platform }}")
          fi
          if [ -n "${{ matrix.macos_target }}" ]; then
            export MACOSX_DEPLOYMENT_TARGET="${{ matrix.macos_target }}"
          fi
          if [ -n "${{ matrix.cross }}" ]; then
            export CC="${{ matrix.cross }}-gcc" CXX="${{ matrix.cross }}-g++"
            export LDSHARED="${{ matrix.cross }}-gcc -shared"
            # only the target's libraries; lz4 found the runner's own liblz4
            export PKG_CONFIG_LIBDIR="/usr/lib/${{ matrix.cross }}/pkgconfig" PKG_CONFIG_PATH=""
          fi

          uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements-build.txt
          uv pip install "${PLATFORM_ARGS[@]}" -r requirements-build.txt pyinstaller==6.14.1
          uv pip install --no-deps .

      - name: Set UTF-8 environment (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "PYTHONUTF8=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PYTHONLEGACYWINDOWSSTDIO=utf8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Build Executable (File)
        run: |
          OFSCRAPER_EXECUTABLE="ofscraper/__main__.py"

          if [ "${{ runner.os }}" == "Windows" ]; then
              VENV_ACTIVATE=".venv/Scripts/activate"
              PYINSTALLER_OPTS="--python-option=utf8"
              EXE_EXT=".exe"
          else
              VENV_ACTIVATE=".venv/bin/activate"
              PYINSTALLER_OPTS="--clean --log DEBUG"
              EXE_EXT=""
          fi
          source "$VENV_ACTIVATE"
          echo "Building executable from: $OFSCRAPER_EXECUTABLE"
          pyinstaller --onefile \
            --name "ofscraper_${{ matrix.artifact_suffix }}_${{ steps.prep_build_version.outputs.sanitized_tag }}${EXE_EXT}" \
            ${PYINSTALLER_OPTS} ${{ matrix.pyinstaller_opts }} \
            "$OFSCRAPER_EXECUTABLE"

      - name: Check the Executable Starts
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then EXE_EXT=".exe"; else EXE_EXT=""; fi
          EXE="dist/ofscraper_${{ matrix.artifact_suffix }}_${{ steps.prep_build_version.outputs.sanitized_tag }}${EXE_EXT}"
          "$EXE" --version
          # loads the argument modules of a subcommand
          "$EXE" db --help > /dev/null

      - name: Build Executable (Dir)
        run: |
          OFSCRAPER_EXECUTABLE="ofscraper/__main__.py"

          if [ "${{ runner.os }}" == "Windows" ]; then
              VENV_ACTIVATE=".venv/Scripts/activate"
              PYINSTALLER_OPTS="--python-option=utf8"
          else
              VENV_ACTIVATE=".venv/bin/activate"
              PYINSTALLER_OPTS="--clean --log DEBUG"
          fi
          source "$VENV_ACTIVATE"
          echo "Building executable from: $OFSCRAPER_EXECUTABLE"
          pyinstaller \
            --name "ofscraper_${{ matrix.artifact_suffix }}_dir" \
            ${PYINSTALLER_OPTS} ${{ matrix.pyinstaller_opts }} \
            "$OFSCRAPER_EXECUTABLE"

      - name: Check the Directory Executable Starts
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then EXE_EXT=".exe"; else EXE_EXT=""; fi
          EXE="dist/ofscraper_${{ matrix.artifact_suffix }}_dir/ofscraper_${{ matrix.artifact_suffix }}_dir${EXE_EXT}"
          "$EXE" --version
          "$EXE" db --help > /dev/null

      - name: Check the Bundled Libraries Resolve
        if: runner.os == 'Linux'
        run: |
          DIR="$PWD/dist/ofscraper_${{ matrix.artifact_suffix }}_dir"
          if [ -n "${{ matrix.cross }}" ]; then LIST="/lib/ld-linux-armhf.so.3 --list"; else LIST="ldd"; fi
          MISSING=$(find "$DIR" -type f \( -name '*.so*' -o -name 'ofscraper_*_dir' \) | while read -r f; do
            LD_LIBRARY_PATH="$DIR/_internal" $LIST "$f" 2>/dev/null | grep 'not found' || true
          done | sort -u)
          if [ -n "$MISSING" ]; then echo "$MISSING"; exit 1; fi
          echo "All bundled libraries resolve"

      - name: Report the Oldest Supported OS
        if: runner.os != 'Windows'
        run: |
          DIR="dist/ofscraper_${{ matrix.artifact_suffix }}_dir"
          # the newest glibc or macOS version each bundled file needs; files
          # that aren't binaries have none, which pipefail would treat as an error
          if [ "${{ runner.os }}" == "Linux" ]; then
            OBJDUMP="objdump"
            if [ -n "${{ matrix.cross }}" ]; then OBJDUMP="${{ matrix.cross }}-objdump"; fi
            needs() { "$OBJDUMP" -T "$1" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -Vu | tail -1 || true; }
            OS_NAME=glibc
          else
            needs() { otool -l "$1" 2>/dev/null | awk '/LC_BUILD_VERSION/{b=1} b && $1=="minos"{print $2; b=0} /LC_VERSION_MIN_MACOSX/{v=1} v && $1=="version"{print $2; v=0}' | sort -Vu | tail -1 || true; }
            OS_NAME=macOS
          fi
          find "$DIR" -type f | while read -r f; do
            v=$(needs "$f"); if [ -n "$v" ]; then echo "$v ${f#"$DIR"/}"; fi
          done | sort -V > oldest-os.txt
          OLDEST=$(tail -1 oldest-os.txt | cut -d' ' -f1)
          test -n "$OLDEST"
          echo "Files that need $OS_NAME $OLDEST:"
          awk -v version="$OLDEST" '$1 == version && ++n <= 20' oldest-os.txt
          echo "ofscraper_${{ matrix.artifact_suffix }} needs $OS_NAME $OLDEST or newer" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Zip Directory (Unix)
        if: runner.os != 'Windows'
        run: zip -r "dist/ofscraper_${{ matrix.artifact_suffix }}_${{ steps.prep_build_version.outputs.sanitized_tag }}.zip" "dist/ofscraper_${{ matrix.artifact_suffix }}_dir"

      - name: Zip Directory (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/ofscraper_${{ matrix.artifact_suffix }}_dir -DestinationPath dist/ofscraper_${{ matrix.artifact_suffix }}_${{ steps.prep_build_version.outputs.sanitized_tag }}.zip -Force
        shell: pwsh

      - name: Prepare Artifact Paths
        id: prepare_paths
        run: |
          OS_SUFFIX="${{ matrix.artifact_suffix }}"
          SANITIZED_TAG="${{ steps.prep_build_version.outputs.sanitized_tag }}"
          
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            EXE_FILE_PATH="dist/ofscraper_${OS_SUFFIX}_${SANITIZED_TAG}.exe"
          else
            EXE_FILE_PATH="dist/ofscraper_${OS_SUFFIX}_${SANITIZED_TAG}"
          fi
          
          ZIP_FILE_PATH="dist/ofscraper_${OS_SUFFIX}_${SANITIZED_TAG}.zip"

          echo "artifact_paths<<EOF" >> "$GITHUB_OUTPUT"
          echo "$EXE_FILE_PATH" >> "$GITHUB_OUTPUT"
          echo "$ZIP_FILE_PATH" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifacts (with custom retries)
        uses: ./.github/actions/retry-artifact-operation
        with:
          operation_type: upload
          name: build-artifacts-${{ matrix.artifact_suffix }}
          path: ${{ steps.prepare_paths.outputs.artifact_paths }}
          if_no_files_found: 'warn'
          overwrite: 'true'

  publish_release:
    name: Publish GitHub Release
    needs: [build_binaries]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating the release
      actions: read # Needed to download artifacts within this job
    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.input_version || github.ref }} # Use the input_version or default branch
          fetch-depth: 0
          fetch-tags: true

      - name: Download all build artifacts (with custom retries)
        uses: ./.github/actions/retry-artifact-operation
        with:
          operation_type: download
          path: artifacts/ # Destination path for downloaded artifacts

      - name: List downloaded files for debugging
        run: ls -R artifacts

      - name: Create or Update Release
        uses: ncipollo/release-action@v1.21.0

        with:
          artifacts: artifacts/*/*
          tag: ${{ inputs.input_version }}
          name: "Release ${{ inputs.input_version }}"
          allowUpdates: true
          omitBodyDuringUpdate: true
