[project]
name = "ofscraper"
version = "3.14.3.post1"
description = "automatically scrape onlyfans"
authors = [{ name = "TesticularMass" }]
readme = "README.md"
requires-python = ">=3.11, <3.15"
dependencies = [
  "aiofiles~=25.1.0",
  "aiohttp~=3.13.3",
  "aiolimiter~=1.2.1",
  "aioprocessing~=2.0.1",
  "arrow~=1.4.0",
  "async-property~=0.2.2",
  "browser-cookie3==0.20.1",
  "beautifulsoup4~=4.14.3",
  "certifi>=2024.7.4,<2027",
  "cloup~=3.0.9",
  "diskcache~=5.6.3",
  "faust-cchardet~=2.1.19",
  "humanfriendly~=10.0",
  "httpx[http2]~=0.28.1",
  "inquirerpy~=0.3.4",
  "lxml>=5.1.0",
  "mpegdash~=0.4.1",
  "pathvalidate~=3.3.1",
  "prompt-toolkit~=3.0.52",
  "psutil~=7.2.2",
  "pynumparser~=1.4.1",
  "pywidevine~=1.9.0",
  "requests>=2.31,<2.34",
  "rich~=15.0.0",
  "schedule~=1.2.2",
  "setproctitle~=1.3.7",
  "tenacity~=9.1.4",
  "textual~=8.2.4",
  "win32-setctime~=1.2.0; sys_platform == 'win32'",
  "xxhash~=3.7.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = ["autopep8~=2.3.2", "pyinstaller~=6.20.0"]
test = [
  "pytest~=7.3.1",
  "pytest-cov~=4.1.0",
]
ffmpeg = ["pyffmpeg>=2.5.2.3.1"]

[project.scripts]
ofscraper = "ofscraper.__main__:main"

[project.urls]
"Homepage" = "https://github.com/TesticularMass/OF-Scraper"

# --- Build System & Tool Configuration ---

# This section tells hatchling how to build the wheel.
[tool.hatch.build.targets.wheel]
packages = ["ofscraper"]

[build-system]
requires = ["hatchling~=1.29.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["test"]
